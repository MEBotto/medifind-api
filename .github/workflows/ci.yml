name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --runInBand

  authentication-api:
    name: Authentication API (Supertest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medifind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medifind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_INTEGRATION_ISOLATED: 'true'
      DB_TEST_SYNCHRONIZE: 'false'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: medifind_test
      JWT_SECRET: ci-only-test-secret-not-for-production-2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        env:
          NODE_ENV: development
        run: >
          npx ts-node -r tsconfig-paths/register
          ./node_modules/typeorm/cli.js
          migration:run -d src/data-source.ts
          --transaction all

      - name: Initialize roles in isolated test database
        run: npm run seed:roles

      - name: Run Authentication API tests
        env:
          RUN_DB_INTEGRATION: 'true'
        run: >
          npm test -- --runInBand --runTestsByPath
          src/users/auth.integration.test.ts

      - name: Run PostgreSQL integration tests
        env:
          RUN_DB_INTEGRATION: '1'
        run: >
          npm test -- --runInBand --runTestsByPath
          src/products/products.integration.test.ts
          src/migrations/rbac-audit.integration.test.ts

  fresh-database:
    name: Fresh database setup
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medifind_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medifind_fresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      DB_TEST_SYNCHRONIZE: 'false'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: medifind_fresh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Initialize empty database
        run: |
          export BOOTSTRAP_ADMIN_EMAIL=admin@example.test
          export BOOTSTRAP_ADMIN_USERNAME=initial_admin
          export BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 20)"
          npm run db:setup:prod

      - name: Verify setup can be rerun without bootstrap credentials
        run: npm run db:setup:prod

      - name: Verify reference data and admin are not duplicated
        run: |
          export PGPASSWORD=postgres
          query() { psql -h localhost -U postgres -d medifind_fresh -tAc "$1" | tr -d '[:space:]'; }
          test "$(query "SELECT count(*) FROM roles WHERE code IN ('ADMIN','PHARMACIST','CUSTOMER')")" = 3
          test "$(query "SELECT count(*) FROM permissions WHERE code IN ('USERS_MANAGE','ROLES_MANAGE','PHARMACIES_MANAGE','PRODUCTS_MANAGE')")" = 4
          test "$(query "SELECT count(*) FROM users WHERE username = 'initial_admin'")" = 1
          test "$(query "SELECT count(*) FROM role_permission")" = 5

      - name: Verify database schema matches TypeORM entities
        run: |
          output=$(npx ts-node -r tsconfig-paths/register \
            ./node_modules/typeorm/cli.js \
            schema:log -d src/data-source.ts)

          printf '%s\n' "$output"

          if ! grep -Fq "Your schema is up to date" <<< "$output"; then
            echo "::error::Database schema does not match TypeORM entities"
            exit 1
          fi

  pharmacy-integration:
    name: Pharmacy PostgreSQL + HTTP integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medifind_pharmacy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medifind_pharmacy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_INTEGRATION_ISOLATED: 'true'
      DB_TEST_SYNCHRONIZE: 'false'
      RUN_DB_INTEGRATION: 'true'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: medifind_pharmacy_ci
      JWT_SECRET: ci-only-test-secret-not-for-production-2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Apply database migrations
        env:
          NODE_ENV: development
        run: >
          npx ts-node -r tsconfig-paths/register
          ./node_modules/typeorm/cli.js
          migration:run -d src/data-source.ts
          --transaction all

      - name: Initialize roles in isolated test database
        run: npm run seed:roles

      - name: Run PostgreSQL and HTTP integration tests
        run: npm run test:integration
